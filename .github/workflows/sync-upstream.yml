name: Sync from upstream

# Pulls vectorize-io/hindsight into this fork. GitHub cannot directly trigger
# workflows in a fork when the upstream repository receives a push, so the
# schedule polls upstream every two hours. repository_dispatch allows an
# upstream webhook/workflow to trigger an immediate sync later if desired.
#
# Conflict policy: abort the merge, leave main untouched, and open (or update)
# one issue for manual resolution. Clean upstream updates are published as the
# fork's latest standalone Docker image.

on:
  schedule:
    # Staggered minute avoids GitHub's top-of-hour scheduler load.
    - cron: '17 */2 * * *'
  repository_dispatch:
    types: [upstream-push]
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'Upstream ref to sync'
        required: false
        default: 'main'
      force_publish_image:
        description: 'Rebuild latest Docker image even when upstream is unchanged'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  packages: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.merge.outputs.updated }}
    env:
      UPSTREAM_REF: ${{ inputs.upstream_ref || 'main' }}
    steps:
      - name: Checkout fork main (full history)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name 'sync-bot'
          git config user.email 'sync-bot@users.noreply.github.com'

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/vectorize-io/hindsight.git
          git fetch --no-tags upstream "$UPSTREAM_REF"

      - name: Merge upstream into fork
        id: merge
        shell: bash
        run: |
          before=$(git rev-parse HEAD)

          if git merge --no-edit FETCH_HEAD; then
            echo "result=clean" >> "$GITHUB_OUTPUT"
            if [ "$(git rev-parse HEAD)" = "$before" ]; then
              echo "updated=false" >> "$GITHUB_OUTPUT"
            else
              echo "updated=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "result=conflict" >> "$GITHUB_OUTPUT"
            conflicts=$(git diff --name-only --diff-filter=U)
            {
              echo 'conflicts<<EOF'
              echo "$conflicts"
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
            git merge --abort
          fi

      - name: Push clean merge
        if: steps.merge.outputs.result == 'clean' && steps.merge.outputs.updated == 'true'
        run: git push origin main

      - name: Report no changes
        if: steps.merge.outputs.result == 'clean' && steps.merge.outputs.updated == 'false'
        run: echo 'Fork already up to date.'

      - name: Open or update conflict issue
        if: steps.merge.outputs.result == 'conflict'
        uses: actions/github-script@v7
        env:
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const title = 'Upstream sync conflict';
            const conflicts = process.env.CONFLICTS || '(no list captured)';
            const body = [
              'Scheduled merge from `vectorize-io/hindsight` could not be applied cleanly.',
              '',
              `Upstream ref: \`${process.env.UPSTREAM_REF}\``,
              '',
              '### Conflicting files',
              '```',
              conflicts,
              '```',
              '',
              'Resolve manually, then close this issue. The sync workflow will retry automatically.',
              '',
              `_Last attempt: ${new Date().toISOString()}_`,
            ].join('\n');

            const openIssues = await github.paginate(
              github.rest.issues.listForRepo,
              { owner, repo, state: 'open', per_page: 100 },
            );
            const existing = openIssues.find(
              issue => !issue.pull_request && issue.title === title,
            );

            if (existing) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }

      - name: Fail on merge conflict
        if: steps.merge.outputs.result == 'conflict'
        run: |
          echo 'Upstream merge has conflicts; fork main was not changed.'
          exit 1

  publish-image:
    needs: sync
    if: needs.sync.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout updated fork main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image metadata
        id: image
        shell: bash
        run: |
          owner=${GITHUB_REPOSITORY_OWNER,,}
          revision=$(git rev-parse HEAD)
          echo "name=ghcr.io/$owner/hindsight:latest" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "version=0.8.4-fork.${revision:0:8}" >> "$GITHUB_OUTPUT"

      - name: Decide whether image needs publishing
        id: publish
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          UPSTREAM_UPDATED: ${{ needs.sync.outputs.updated }}
          FORCE_PUBLISH: ${{ inputs.force_publish_image || false }}
        run: |
          if [ "$FORCE_PUBLISH" = 'true' ] || [ "$UPSTREAM_UPDATED" = 'true' ]; then
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          elif docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish latest fork image
        if: steps.publish.outputs.needed == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/standalone/Dockerfile
          target: standalone
          pull: true
          push: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.image.outputs.revision }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}

      - name: Report existing image
        if: steps.publish.outputs.needed == 'false'
        run: echo 'Fork latest image already exists; build skipped.'
